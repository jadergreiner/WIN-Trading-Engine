name: BMad v6 bootstrap validation

on:
  pull_request:
    paths:
      - "scripts/install-bmad.sh"
      - "scripts/verify-bmad.sh"
      - "scripts/install-bmad.ps1"
      - "docs/bmad/**"
      - "AGENTS.md"
      - ".github/workflows/bmad-bootstrap-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Verify prerequisites and Bash syntax
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          npm --version
          python --version
          uv --version
          bash -n scripts/install-bmad.sh scripts/verify-bmad.sh
      - name: Install official pinned BMad in ephemeral runner
        shell: bash
        run: |
          set -o pipefail
          bash scripts/install-bmad.sh 2>&1 | tee bmad-install.log
      - name: Verify installed runtime
        shell: bash
        run: |
          bash scripts/verify-bmad.sh
          test -d _bmad/bmm
          echo "BMad instalado somente no runner efêmero"
      - name: Check that no credentials or AWS resources are introduced
        shell: bash
        run: |
          test ! -d secrets
          test ! -f .env
          test ! -d infra/terraform/.terraform
      - name: Upload installation diagnostics (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmad-install-diagnostics
          path: bmad-install.log
          if-no-files-found: warn
          retention-days: 7
